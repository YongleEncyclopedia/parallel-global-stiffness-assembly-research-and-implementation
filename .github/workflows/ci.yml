name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: CI / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/requirements.txt
            demos/csc3_symmetric_assembly_demo/requirements-test.txt

      - name: Install Python dependencies
        run: python -m pip install ninja -r requirements.txt

      - name: Install CSC3 Python test dependencies
        working-directory: demos/csc3_symmetric_assembly_demo
        run: python -m pip install -r requirements-test.txt

      - name: Install CSC3 format checker
        run: python -m pip install clang-format==22.1.8

      - name: Configure, build, and test CPU project
        run: |
          cmake --preset cpu-ci
          cmake --build --preset cpu-ci --parallel
          python scripts/check_ctest_inventory.py --build-dir build/cpu-ci --expected tests/ctest/expected-ci-tests.txt --label ci
          ctest --preset cpu-ci --output-on-failure --output-junit ctest.xml
          python scripts/check_ctest_junit.py --junit build/cpu-ci/ctest.xml --expected-tests 14

      - name: Run repository contract
        run: |
          ctest --test-dir build/cpu-ci -L repository --output-on-failure --output-junit repository.xml
          python scripts/check_ctest_junit.py --junit build/cpu-ci/repository.xml --expected-tests 1

      - name: Configure, build, and test CSC3 demo
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: |
          cmake --preset delivery -B build/ci -DCSC3_DEMO_ENABLE_FORMAT_CHECK=ON
          cmake --build build/ci --config Release --parallel
          cmake --build build/ci --target csc3_demo_format_check
          python scripts/check_ctest_inventory.py --build-dir build/ci --expected tests/ctest/expected-ci-tests.txt --label ci
          ctest --test-dir build/ci -C Release -L ci --output-on-failure --no-tests=error --output-junit ctest.xml
          python scripts/check_ctest_junit.py --junit build/ci/ctest.xml --expected-tests 10

      - name: Build and run portable WindHub package on Linux
        working-directory: ${{ github.workspace }}
        run: |
          package_output="${RUNNER_TEMP}/csc3-portable-linux-package"
          extraction_root="${RUNNER_TEMP}/csc3-portable-linux-clean"
          test ! -e "${package_output}"
          test ! -e "${extraction_root}"
          python demos/csc3_symmetric_assembly_demo/scripts/create_portable_delivery.py create \
            --repository-root . \
            --output-dir "${package_output}" \
            --commit HEAD
          package="$(find "${package_output}" -maxdepth 1 -type f -name 'csc3-windhub-demo-*.zip' -print -quit)"
          test -n "${package}"
          python demos/csc3_symmetric_assembly_demo/scripts/create_portable_delivery.py verify \
            --package "${package}"
          mkdir "${extraction_root}"
          unzip -q "${package}" -d "${extraction_root}"
          cd "${extraction_root}/csc3-windhub-demo"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          bash examples/run_windhub_demo.sh
          result_dir="$(find build/presentation-results -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "${result_dir}/summary.md"
          python - "${result_dir}/run_manifest.json" <<'PY'
          import json
          import pathlib
          import sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert manifest["status"] == "PASS"
          assert manifest["formal_evidence"] is False
          assert manifest["source"]["provenance_mode"] == "portable-package"
          assert manifest["environment"]["platform"] == "linux"
          assert manifest["input"]["matches_package_manifest"] is True
          assert manifest["sample"]["peak_resident_memory_bytes"] > 0
          requested = manifest["configuration"]["thread_count"]
          assert manifest["sample"]["symbolic_team_size_observed"] == requested
          assert manifest["sample"]["numeric_team_size_observed"] == requested
          PY

      - name: Verify restricted formal host affinity is blocked
        working-directory: demos/csc3_symmetric_assembly_demo
        run: |
          restricted_cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          CSC3_EXPECT_RESTRICTED_AFFINITY=1 taskset --cpu-list "$restricted_cpu" \
            python -m unittest \
            tests.python.test_run_benchmark.WorkflowOrchestrationTests.test_restricted_linux_affinity_blocks_before_any_command

      - name: Repeat high-contention atomic assembly
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: >-
          ctest --test-dir build/ci -C Release
          -R '^Csc3DemoAtomicContention$'
          --repeat until-fail:20
          --output-on-failure
          --no-tests=error

      - name: Run CSC3 ASan and UBSan tests
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake --preset ci-sanitizers -B build/ci-sanitizers
          cmake --build build/ci-sanitizers --parallel
          python scripts/check_ctest_inventory.py --build-dir build/ci-sanitizers --expected tests/ctest/expected-cpp-tests.txt --label ci
          ctest --test-dir build/ci-sanitizers -L ci --output-on-failure --no-tests=error --output-junit ctest.xml
          python scripts/check_ctest_junit.py --junit build/ci-sanitizers/ctest.xml --expected-tests 9

      - name: Verify OpenMP is mandatory
        working-directory: demos/csc3_symmetric_assembly_demo
        run: |
          negative_dir="${RUNNER_TEMP}/csc3-openmp-negative"
          if cmake -S . -B "${negative_dir}" -G Ninja \
              -DCSC3_DEMO_REQUIRE_OPENMP=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON \
              -DBUILD_TESTING=OFF; then
            echo "OpenMP negative configuration unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Build standalone CSC3 external consumer
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: |
          cmake -S tests/external_consumer -B build/external-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCSC3_DEMO_REQUIRE_OPENMP=ON -DCSC3_DEMO_WARNINGS_AS_ERRORS=ON
          cmake --build build/external-consumer --parallel
          ctest --test-dir build/external-consumer -R '^Csc3DemoExternalConsumer$' --output-on-failure --no-tests=error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ci-ubuntu-failure-logs
          path: |
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/CMakeFiles/CMakeConfigureLog.yaml
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/CMakeFiles/CMakeOutput.log
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/CMakeFiles/CMakeError.log
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/Testing/Temporary/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/ctest.xml
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/repository.xml
            demos/csc3_symmetric_assembly_demo/build/ci/CMakeFiles/CMakeConfigureLog.yaml
            demos/csc3_symmetric_assembly_demo/build/ci/Testing/Temporary/
            demos/csc3_symmetric_assembly_demo/build/ci/ctest.xml
            demos/csc3_symmetric_assembly_demo/build/ci-sanitizers/CMakeFiles/CMakeConfigureLog.yaml
            demos/csc3_symmetric_assembly_demo/build/ci-sanitizers/Testing/Temporary/
            demos/csc3_symmetric_assembly_demo/build/ci-sanitizers/ctest.xml
            demos/csc3_symmetric_assembly_demo/build/external-consumer/CMakeFiles/CMakeConfigureLog.yaml
            demos/csc3_symmetric_assembly_demo/build/external-consumer/Testing/Temporary/
            ${{ runner.temp }}/csc3-openmp-negative/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  macos:
    name: CI / macOS
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly
    steps:
      - name: Check out CPU project
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/CMakeLists.txt
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/CMakePresets.json
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/cmake/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/requirements.txt
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/apps/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/include/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/src/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/tests/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/scripts/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/examples/
            demos/csc3_symmetric_assembly_demo/
            examples/3d-WindTurbineHub.inp
          sparse-checkout-cone-mode: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/requirements.txt
            demos/csc3_symmetric_assembly_demo/requirements-test.txt

      - name: Install OpenMP
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: python -m pip install ninja -r requirements.txt

      - name: Install CSC3 Python test dependencies
        working-directory: demos/csc3_symmetric_assembly_demo
        run: python -m pip install -r requirements-test.txt

      - name: Configure, build, and test CPU project
        run: |
          cmake --preset cpu-ci
          cmake --build --preset cpu-ci --parallel
          python scripts/check_ctest_inventory.py --build-dir build/cpu-ci --expected tests/ctest/expected-ci-tests.txt --label ci
          ctest --preset cpu-ci --output-on-failure --output-junit ctest.xml
          python scripts/check_ctest_junit.py --junit build/cpu-ci/ctest.xml --expected-tests 14

      - name: Configure, build, and test CSC3 demo
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: |
          cmake --preset delivery -B build/ci
          cmake --build build/ci --config Release --parallel
          python scripts/check_ctest_inventory.py --build-dir build/ci --expected tests/ctest/expected-ci-tests.txt --label ci
          ctest --test-dir build/ci -C Release -L ci --output-on-failure --no-tests=error --output-junit ctest.xml
          python scripts/check_ctest_junit.py --junit build/ci/ctest.xml --expected-tests 10

      - name: Build standalone CSC3 external consumer
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: |
          cmake -S tests/external_consumer -B build/external-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCSC3_DEMO_REQUIRE_OPENMP=ON -DCSC3_DEMO_WARNINGS_AS_ERRORS=ON
          cmake --build build/external-consumer --parallel
          ctest --test-dir build/external-consumer -R '^Csc3DemoExternalConsumer$' --output-on-failure --no-tests=error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ci-macos-failure-logs
          path: |
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/CMakeFiles/CMakeConfigureLog.yaml
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/CMakeFiles/CMakeOutput.log
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/CMakeFiles/CMakeError.log
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/Testing/Temporary/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/build/cpu-ci/ctest.xml
            demos/csc3_symmetric_assembly_demo/build/ci/CMakeFiles/CMakeConfigureLog.yaml
            demos/csc3_symmetric_assembly_demo/build/ci/Testing/Temporary/
            demos/csc3_symmetric_assembly_demo/build/ci/ctest.xml
            demos/csc3_symmetric_assembly_demo/build/external-consumer/CMakeFiles/CMakeConfigureLog.yaml
            demos/csc3_symmetric_assembly_demo/build/external-consumer/Testing/Temporary/
          if-no-files-found: ignore

  windows:
    name: CI / Windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly
    steps:
      - name: Enable Git long paths
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true

      - name: Check out CPU project
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/CMakeLists.txt
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/CMakePresets.json
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/cmake/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/requirements.txt
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/apps/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/include/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/src/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/tests/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/scripts/
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/examples/
            demos/csc3_symmetric_assembly_demo/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            parallel_global_stiffness_assembly/cpu_parallel_stiffness_assembly/requirements.txt
            demos/csc3_symmetric_assembly_demo/requirements-test.txt

      - name: Install Python dependencies
        run: python -m pip install ninja -r requirements.txt

      - name: Install CSC3 Python test dependencies
        working-directory: demos/csc3_symmetric_assembly_demo
        run: python -m pip install -r requirements-test.txt

      - name: Prepare clean CSC3 README source copies
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageOutput = Join-Path $env:RUNNER_TEMP "csc3-portable-windows-package"
          if (Test-Path $packageOutput) {
            throw "Portable package output already exists: $packageOutput"
          }
          python demos/csc3_symmetric_assembly_demo/scripts/create_portable_delivery.py create --repository-root . --output-dir $packageOutput --commit HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem -LiteralPath $packageOutput -Filter "csc3-windhub-demo-*.zip")
          if ($archives.Count -ne 1) {
            throw "Expected exactly one portable package, found $($archives.Count)"
          }
          $archive = $archives[0]
          python demos/csc3_symmetric_assembly_demo/scripts/create_portable_delivery.py verify --package $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($rootName in @("c3-readme-msvc", "c3-readme-mingw")) {
            $root = Join-Path $env:RUNNER_TEMP $rootName
            if (Test-Path $root) {
              throw "README clean-room path already exists: $root"
            }
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $root
            $demo = Join-Path $root "csc3-windhub-demo"
            if (-not (Test-Path (Join-Path $demo "CMakeLists.txt"))) {
              throw "README clean-room source is incomplete: $demo"
            }
            if ((Test-Path (Join-Path $demo "build")) -or
                (Test-Path (Join-Path $demo "build-mingw"))) {
              throw "README clean-room source contains an old build directory"
            }
          }

      - name: Run CSC3 README MSVC build commands in ordinary PowerShell
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        working-directory: ${{ runner.temp }}/c3-readme-msvc/csc3-windhub-demo
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @("CMAKE_GENERATOR", "CMAKE_CXX_COMPILER", "VSCMD_VER", "VSINSTALLDIR", "VCINSTALLDIR", "INCLUDE", "LIB", "LIBPATH")) {
            if (Test-Path "Env:$name") {
              throw "Unexpected developer-shell variable: $name"
            }
          }
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) {
            throw "cl.exe must not be preloaded for the ordinary PowerShell check"
          }
          if (Test-Path "build") {
            throw "README MSVC build directory must not exist before the check"
          }

          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ..
          cmake --build . --config Release

          $cache = Get-Content -LiteralPath ".\CMakeCache.txt"
          if ($cache -notcontains "CMAKE_GENERATOR:INTERNAL=Visual Studio 17 2022") {
            throw "README build commands did not select the Visual Studio 2022 generator"
          }
          $compilerFile = Get-ChildItem -LiteralPath ".\CMakeFiles" -Filter "CMakeCXXCompiler.cmake" -Recurse | Select-Object -First 1
          if (-not $compilerFile -or
              -not (Select-String -LiteralPath $compilerFile.FullName -SimpleMatch 'set(CMAKE_CXX_COMPILER_ID "MSVC")' -Quiet)) {
            throw "README build commands did not configure MSVC"
          }
          ctest -C Release --output-on-failure
          powershell -NoProfile -ExecutionPolicy Bypass -File ..\examples\run_windhub_demo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $results = @(Get-ChildItem -LiteralPath ".\presentation-results" -Directory)
          if ($results.Count -ne 1) {
            throw "Expected exactly one presentation result, found $($results.Count)"
          }
          $result = $results[0]
          $manifest = Get-Content -LiteralPath (Join-Path $result.FullName "run_manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.status -ne "PASS" -or $manifest.formal_evidence -ne $false) {
            throw "Portable Windows presentation did not pass"
          }
          if ($manifest.source.provenance_mode -ne "portable-package" -or
              $manifest.input.matches_package_manifest -ne $true) {
            throw "Portable Windows presentation did not verify package provenance"
          }
          if ($manifest.sample.peak_working_set_bytes -le 0 -or
              $manifest.sample.symbolic_team_size_observed -ne $manifest.configuration.thread_count -or
              $manifest.sample.numeric_team_size_observed -ne $manifest.configuration.thread_count) {
            throw "Portable Windows presentation metrics are incomplete"
          }
          if (-not (Test-Path ".\lib\csc3_demo.lib")) {
            throw "README build commands did not create the MSVC static library"
          }

      - name: Enter Visual Studio x64 shell, configure, build, and test
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "A Visual Studio installation with the x64 C++ toolchain was not found"
          }
          $devShellModule = Join-Path $installationPath "Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShellModule
          Enter-VsDevShell -VsInstallPath $installationPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          Get-Command cl.exe -ErrorAction Stop
          $buildDir = "$env:RUNNER_TEMP\pgsa-cpu-ci"
          cmake --preset cpu-ci -B $buildDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $buildDir --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_ctest_inventory.py --build-dir $buildDir --expected tests/ctest/expected-ci-tests.txt --label ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $buildDir -L ci --output-on-failure --output-junit ctest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_ctest_junit.py --junit $buildDir/ctest.xml --expected-tests 14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test full CSC3 suite with MSVC
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere"
          }
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "A Visual Studio installation with the x64 C++ toolchain was not found"
          }
          $devShellModule = Join-Path $installationPath "Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShellModule
          Enter-VsDevShell -VsInstallPath $installationPath -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          Get-Command cl.exe -ErrorAction Stop

          $buildDir = "$env:RUNNER_TEMP\csc3-demo-ci"
          cmake --preset delivery -B $buildDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $buildDir --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_ctest_inventory.py --build-dir $buildDir --expected tests/ctest/expected-ci-tests.txt --label ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $buildDir -C Release -L ci --output-on-failure --no-tests=error --output-junit ctest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_ctest_junit.py --junit "$buildDir\ctest.xml" --expected-tests 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $consumerBuildDir = "$env:RUNNER_TEMP\csc3-demo-external-consumer"
          cmake -S tests/external_consumer -B $consumerBuildDir -G Ninja -DCMAKE_BUILD_TYPE=Release -DCSC3_DEMO_REQUIRE_OPENMP=ON -DCSC3_DEMO_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $consumerBuildDir --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $consumerBuildDir -R '^Csc3DemoExternalConsumer$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install MinGW-w64 for CSC3 demo
        id: install-mingw
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $msysBash = "C:\msys64\usr\bin\bash.exe"
          if (-not (Test-Path $msysBash)) {
            throw "The Windows runner does not contain the documented MSYS2 installation"
          }
          & $msysBash -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CSC3 README MinGW compatibility build in ordinary PowerShell
        if: ${{ !cancelled() && steps.install-mingw.outcome == 'success' }}
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        working-directory: ${{ runner.temp }}/c3-readme-mingw/csc3-windhub-demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:Path = (($env:Path -split ";") | Where-Object { $_ -and $_ -notmatch '^(?i)C:[\\/]msys64[\\/]mingw64[\\/]bin[\\/]?$' }) -join ";"
          if (($env:Path -split ";") -match '^(?i)C:[\\/]msys64[\\/]mingw64[\\/]bin[\\/]?$') {
            throw "The README PATH entry must not be preloaded"
          }
          foreach ($name in @("CMAKE_GENERATOR", "CMAKE_CXX_COMPILER")) {
            if (Test-Path "Env:$name") {
              throw "Unexpected MinGW configuration variable: $name"
            }
          }
          if (Test-Path "build-mingw") {
            throw "README MinGW build directory must not exist before the check"
          }

          $env:Path = "C:\msys64\mingw64\bin;$env:Path"
          mkdir build-mingw
          cd build-mingw
          cmake -G Ninja "-DCMAKE_CXX_COMPILER=C:/msys64/mingw64/bin/g++.exe" ..
          cmake --build .
          ctest --output-on-failure
          $cache = Get-Content -LiteralPath ".\CMakeCache.txt"
          $expectedCache = @{
            "generator" = '^CMAKE_GENERATOR:INTERNAL=Ninja$'
            "compiler" = '^CMAKE_CXX_COMPILER:(?:FILEPATH|STRING)=C:/msys64/mingw64/bin/g\+\+\.exe$'
            "build tool" = '^CMAKE_MAKE_PROGRAM:FILEPATH=C:/msys64/mingw64/bin/ninja\.exe$'
            "CMake" = '^CMAKE_COMMAND:INTERNAL=C:/msys64/mingw64/bin/cmake\.exe$'
          }
          foreach ($entry in $expectedCache.GetEnumerator()) {
            if (-not ($cache -match $entry.Value)) {
              throw "README compatibility commands did not use the documented MinGW $($entry.Key)"
            }
          }
          if (-not (Test-Path ".\lib\libcsc3_demo.a")) {
            throw "README compatibility commands did not create the MinGW static library"
          }

      - name: Build and test CSC3 demo with MinGW-w64 and Ninja
        if: ${{ !cancelled() && steps.install-mingw.outcome == 'success' }}
        shell: pwsh
        working-directory: demos/csc3_symmetric_assembly_demo
        env:
          OMP_NUM_THREADS: '2'
          OMP_THREAD_LIMIT: '2'
          OMP_DYNAMIC: 'false'
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\msys64\mingw64\bin;$env:Path"
          Get-Command g++.exe -ErrorAction Stop
          Get-Command ninja.exe -ErrorAction Stop

          $buildDir = "$env:RUNNER_TEMP\csc3-demo-mingw-ci"
          cmake --preset submission -B $buildDir "-DCMAKE_CXX_COMPILER=C:/msys64/mingw64/bin/g++.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $buildDir --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_ctest_inventory.py --build-dir $buildDir --expected tests/ctest/expected-cpp-tests.txt --label ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $buildDir -L ci --output-on-failure --no-tests=error --output-junit ctest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_ctest_junit.py --junit "$buildDir\ctest.xml" --expected-tests 9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $consumerBuildDir = "$env:RUNNER_TEMP\csc3-demo-mingw-consumer"
          cmake -S tests/external_consumer -B $consumerBuildDir -G Ninja "-DCMAKE_CXX_COMPILER=C:/msys64/mingw64/bin/g++.exe" -DCMAKE_BUILD_TYPE=Release -DCSC3_DEMO_REQUIRE_OPENMP=ON -DCSC3_DEMO_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $consumerBuildDir --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $consumerBuildDir -R '^Csc3DemoExternalConsumer$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ci-windows-failure-logs
          path: |
            ${{ runner.temp }}/pgsa-cpu-ci/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/pgsa-cpu-ci/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/pgsa-cpu-ci/CMakeFiles/CMakeError.log
            ${{ runner.temp }}/pgsa-cpu-ci/Testing/Temporary/
            ${{ runner.temp }}/pgsa-cpu-ci/ctest.xml
            ${{ runner.temp }}/pgsa-cpu-ci/isolated-backend-thread-sweep-smoke/
            ${{ runner.temp }}/pgsa-cpu-ci/isolated-symbolic-memory-smoke/
            ${{ runner.temp }}/c3-readme-msvc/demos/csc3_symmetric_assembly_demo/build/CMakeCache.txt
            ${{ runner.temp }}/c3-readme-msvc/demos/csc3_symmetric_assembly_demo/build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/c3-readme-msvc/demos/csc3_symmetric_assembly_demo/build/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/c3-readme-msvc/demos/csc3_symmetric_assembly_demo/build/CMakeFiles/CMakeError.log
            ${{ runner.temp }}/c3-readme-mingw/demos/csc3_symmetric_assembly_demo/build-mingw/CMakeCache.txt
            ${{ runner.temp }}/c3-readme-mingw/demos/csc3_symmetric_assembly_demo/build-mingw/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/c3-readme-mingw/demos/csc3_symmetric_assembly_demo/build-mingw/CMakeFiles/CMakeOutput.log
            ${{ runner.temp }}/c3-readme-mingw/demos/csc3_symmetric_assembly_demo/build-mingw/CMakeFiles/CMakeError.log
            ${{ runner.temp }}/csc3-demo-ci/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/csc3-demo-ci/Testing/Temporary/
            ${{ runner.temp }}/csc3-demo-ci/ctest.xml
            ${{ runner.temp }}/csc3-demo-external-consumer/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/csc3-demo-external-consumer/Testing/Temporary/
            ${{ runner.temp }}/csc3-demo-mingw-ci/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/csc3-demo-mingw-ci/Testing/Temporary/
            ${{ runner.temp }}/csc3-demo-mingw-ci/ctest.xml
            ${{ runner.temp }}/csc3-demo-mingw-consumer/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/csc3-demo-mingw-consumer/Testing/Temporary/
          if-no-files-found: ignore
