  - generic [ref=e42]:
    - generic [ref=e43]: Context
    - heading "先把背景压到能听懂的程度" [level=2] [ref=e44]
    - generic [ref=e45]:
      - generic [ref=e46]:
        - paragraph [ref=e47]:
          - text: 有限元法（finite element method，FEM）会把一个连续结构切成很多小单元。每个小单元都能算出自己的局部刚度矩阵
          - code [ref=e48]: Ke
          - text: ，表示这个小块在受力后有多“硬”。
        - paragraph [ref=e49]: 工程求解前，需要把所有小单元的局部贡献加到同一个整体刚度矩阵（global stiffness matrix）里。这个动作叫组装（assembly）。它看起来像“加法”，但在百万级单元上会变成一个很现实的并行写入问题：很多线程可能同时想写同一个矩阵位置。
        - paragraph [ref=e50]: 这个项目研究的不是求解器本身，而是求解器之前的关键环节：怎样在共享内存多核 CPU 上，把整体刚度矩阵组装得又快又可验证。
      - generic [ref=e51]:
        - heading "为什么它值得公司同事关心" [level=3] [ref=e52]
        - list [ref=e53]:
          - listitem [ref=e54]: 它连接算法研究和工程工作站部署：不依赖 GPU，也能在普通多核 CPU 上复现。
          - listitem [ref=e55]: 它把“快”拆成可解释的工程指标：正确性、组装时间、预处理时间、内存和平台环境。
          - listitem [ref=e56]: 它能沉淀成可复现实验平台，后续换算法、换机器、换算例时不必重写一套对比流程。
